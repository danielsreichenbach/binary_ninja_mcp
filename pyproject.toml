[project]
name = "binary-ninja-mcp"
version = "1.1.0"
description = "MCP bridge for Binary Ninja providing 80+ tools for AI-assisted binary analysis"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "requests>=2.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
