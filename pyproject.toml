[project]
name = "binary-ninja-mcp"
version = "1.1.0"
description = "MCP bridge for Binary Ninja providing 80+ tools for AI-assisted binary analysis"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "requests>=2.28",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "ruff>=0.8",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
